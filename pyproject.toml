[project]
name = "pharma-prescriber-copilot"
version = "1.0.0"
description = "Prescriber analytics, forecasting, and agentic text-to-SQL over CMS Part D data."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E402"]  # deliberate late imports after matplotlib.use("Agg")

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
