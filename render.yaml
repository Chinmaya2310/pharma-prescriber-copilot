# Render deployment for the Prescriber Analytics API (free web-service tier).
# The service SERVES a prebuilt warehouse rebuilt from compact parquets at start,
# using slim serving-only deps — no torch/prophet/xgboost in the runtime image.
services:
  - type: web
    name: pharma-prescriber-copilot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-api.txt
    # Build the serving DB from committed parquets, then launch the API.
    startCommand: python scripts/build_deploy_db.py && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # The /ask text-to-SQL endpoint needs this; set it in the Render dashboard
      # (sync:false keeps it out of source control).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TEXT2SQL_MODEL
        value: claude-opus-4-8
