name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly scheduled retrain demo (Mon 06:00 UTC). In production this job would
    # run `retrain.py --download`; CMS blocks CI IPs, so we retrain on the
    # synthetic fixture to exercise the full pipeline end-to-end. See DECISIONS.md.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OpenMP runtime (for xgboost)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

  scheduled-retrain:
    # Only on the weekly schedule or manual dispatch — not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Retrain pipeline (synthetic fixture in CI)
        run: python -m src.mlops.retrain --synthetic
      - name: Upload model + report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrain-artifacts
          path: |
            models/
            reports/
